<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UVRETOPO Web App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>UVRETOPO</h1>
      <p>Upload a high-poly glTF/GLB model, optimize it to low-poly, and download a game-ready asset.</p>
    </header>

    <main>
      <section class="controls">
        <form id="uploadForm">
          <label>
            3D Model (.glb/.gltf)
            <input id="modelInput" type="file" name="model" accept=".glb,.gltf" required />
          </label>

          <label>
            Target polygon retention: <span id="targetValue">25%</span>
            <input id="targetPercent" type="range" min="5" max="95" value="25" name="targetPercent" />
          </label>

          <button type="submit">Retopologize + Transfer Textures</button>
        </form>

        <div id="status" class="status">Waiting for upload…</div>

        <div id="results" class="results hidden">
          <p><strong>Source triangles:</strong> <span id="sourceTriangles"></span></p>
          <p><strong>Optimized triangles:</strong> <span id="optimizedTriangles"></span></p>
          <p><strong>Retained:</strong> <span id="retainedPercent"></span>%</p>
          <a id="downloadLink" href="#" download>Download optimized model</a>
        </div>
      </section>

      <section class="preview">
        <div class="pane">
          <h2>High-poly (Original)</h2>
          <canvas id="sourceCanvas"></canvas>
        </div>
        <div class="pane">
          <h2>Low-poly (Optimized)</h2>
          <canvas id="optimizedCanvas"></canvas>
        </div>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
